name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck ci/check-root tests/*.bats

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install bats on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes bats
      - name: Install bats on macOS
        if: runner.os == 'macOS'
        run: brew install bats-core
      - name: Root holds no instruction files
        run: ci/check-root
      - name: Tests
        run: bats tests
