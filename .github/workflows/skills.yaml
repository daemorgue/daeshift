name: Skills

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontmatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.5"
      - name: Install tiredize from its hashed requirements
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --require-hashes --only-binary :all: \
            -r requirements/tiredize.txt
      - name: Frontmatter follows the specification
        run: .venv/bin/tiredize --frontmatter-schema ci/skill-frontmatter.yaml skills/*/SKILL.md

  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned tools
        run: |
          ci/install-tools -q "${RUNNER_TEMP}/tools"
          echo "${RUNNER_TEMP}/tools/bin" >> "${GITHUB_PATH}"
      - run: shellcheck ci/check-skills tests/check-skills.bats
        if: runner.os == 'Linux'
      - name: Skills follow the specification
        run: ci/check-skills
      - name: Tests
        run: bats tests/check-skills.bats
